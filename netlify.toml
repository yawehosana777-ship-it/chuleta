# Publicación en Netlify (Fase 8).
# La aplicación vive en la carpeta "plataforma"; Netlify detecta Next.js solo
# (adaptador OpenNext) y publica cada cambio que llegue a la rama main.
# Las claves NO van aquí: se pegan en Netlify › Site configuration › Environment variables.

[build]
  base = "plataforma"
  command = "npm run build"
  # Relativo a la raíz del repositorio (así lo resuelve Netlify aunque haya "base").
  publish = "plataforma/.next"

# Adaptador oficial de Next.js (también al publicar desde la computadora con `netlify deploy --build`).
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Versión de soporte largo de Node.
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"
